[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python-project-template"
version = "0.1.0"
description = "A reusable Python project starter"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "molecular-utilities @ git+https://github.com/eisenmann-bastian/molecular-utilities.git",
]

[project.scripts]
python-template = "python_template.cli:main"

[tool.setuptools.packages.find]
include = ["python_template*"]
